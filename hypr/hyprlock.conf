# Unia Breathe — екран блокування (скло на розмитому знімку столу)
general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 10
    brightness = 0.55
    vibrancy = 0.2
}

# годинник у скляній «бульбашці»
shape {
    monitor =
    size = 360, 150
    rounding = 32
    color = rgba(081e19a0)
    border_size = 1
    border_color = rgba(ffffff24)
    position = 0, 150
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = Manrope ExtraBold
    color = rgb(eaf6f0)
    position = 0, 168
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] LC_TIME=uk_UA.UTF-8 date +"%A, %-d %B"
    font_size = 16
    font_family = Manrope SemiBold
    color = rgb(bfe3d5)
    position = 0, 105
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    rounding = 26
    outline_thickness = 2
    outer_color = rgba(10b981ee)
    inner_color = rgba(081e19c0)
    font_color = rgb(eaf6f0)
    font_family = Manrope
    check_color = rgb(13eca4)
    fail_color = rgb(f26464)
    fail_text = Неправильний пароль
    placeholder_text = <span foreground="##bfe3d5">Пароль…</span>
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = Manrope Bold
    color = rgb(bfe3d5)
    position = 0, -100
    halign = center
    valign = center
}
