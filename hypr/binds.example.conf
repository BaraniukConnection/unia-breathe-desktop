# Unia Breathe Desktop: example key bindings for the shell.
# Not sourced automatically, so it never doubles bindings you already have. Copy what you need into
# ~/.config/hypr/hyprland.conf, or source the whole file from there:
#   source = ~/unia-breathe/hypr/binds.example.conf

$mod = SUPER

# App menu (TileMenu), control centre, desks and scenarios, settings
bind = $mod, R, exec, qs -c unia ipc call popups toggle menu
bind = $mod, N, exec, qs -c unia ipc call popups toggle nc
bind = $mod, S, exec, qs -c unia ipc call popups toggle ws
bind = $mod, I, exec, qs -c unia ipc call settings toggle
# in Settings: back to the category panel; elsewhere: the next window
bind = $mod, Tab, exec, qs -c unia ipc call settings back

# Windows
bind = $mod, M, exec, qs -c unia ipc call windows minimize      # restore with a click on the bar
bind = $mod, L, exec, loginctl lock-session
# WindowDrop: Super+LMB picks up the window under the cursor (it becomes a square and its landing spot
# shows in advance); Super+RMB keeps Hyprland's own resize
bind = $mod, mouse:272, exec, qs -c unia ipc call drop grab
bindr = $mod, mouse:272, exec, qs -c unia ipc call drop release
bindm = $mod, mouse:273, resizewindow

# Screenshots and screen recording (as in Ubuntu): Print opens the picker,
# Shift+Print takes the whole screen, Alt+Print the window
bind = , Print, exec, qs -c unia ipc call shot open
bind = $mod, Print, exec, qs -c unia ipc call shot open
bind = SHIFT, Print, exec, qs -c unia ipc call shot screen
bind = ALT, Print, exec, qs -c unia ipc call shot window
