# Unia Breathe Desktop: Hyprland rules for the shell (sourced from ~/.config/hypr/hyprland.conf)

# Glass: blur under every shell surface (the unia-* namespace)
layerrule = blur on, match:namespace ^(unia-.*)$
layerrule = ignore_alpha 0.2, match:namespace ^(unia-.*)$

# The shell's tooltips (xdg-popup) are blurred too
decoration {
    blur {
        popups = true
    }
}

# The shell
exec-once = qs -c unia

# Settings: the shell's own windows (titled "Unia · …") live on the settings special workspace
windowrule = float on, match:title ^(Unia · .*)$
windowrule = workspace special:settings silent, match:title ^(Unia · .*)$
windowrule = rounding 26, match:title ^(Unia · .*)$
windowrule = no_shadow on, match:title ^(Unia · .*)$

# WindowDrop: the "place", a translucent empty window that shows where a dragged window will land.
# It is tiled like any window (neighbours make room), opens on a hidden desk, takes no focus (focusing a window on
# a hidden desk would reveal the whole desk), and has no border or shadow
windowrule = tile on, match:title ^(unia-drop-place)$
windowrule = workspace special:unia-drop silent, match:title ^(unia-drop-place)$
windowrule = no_initial_focus on, match:title ^(unia-drop-place)$
windowrule = no_focus on, match:title ^(unia-drop-place)$
windowrule = border_size 0, match:title ^(unia-drop-place)$
windowrule = no_shadow on, match:title ^(unia-drop-place)$
windowrule = rounding 14, match:title ^(unia-drop-place)$
windowrule = opacity 1.0 override 1.0 override, match:title ^(unia-drop-place)$

# ---------- Unia Breathe Desktop theme: window borders in the emerald palette (theme colours from Settings override them) ----------
general {
    col.active_border = rgba(10b981ee) rgba(13eca499) 45deg
    col.inactive_border = rgba(eaf6f01a)
}
decoration {
    shadow {
        color = rgba(00000066)
    }
}

# Changes from the shell's own settings pages: sourced last, so they override the main config
source = ~/.config/unia-breathe/hyprland.conf
