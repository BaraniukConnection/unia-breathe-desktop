# Unia Breathe: правила Hyprland для оболонки (підключається з ~/.config/hypr/hyprland.conf)

# Скло: розмиття під усіма поверхнями оболонки (простір імен unia-*)
layerrule = blur on, match:namespace ^(unia-.*)$
layerrule = ignore_alpha 0.2, match:namespace ^(unia-.*)$

# Спливаючі підказки оболонки (xdg-popup) теж розмиваються
decoration {
    blur {
        popups = true
    }
}

# Оболонка
exec-once = qs -c unia
