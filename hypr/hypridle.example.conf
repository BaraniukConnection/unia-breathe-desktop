# Unia Breathe Desktop: an example ~/.config/hypr/hypridle.conf.
# Sleep goes through unia-sleep: it locks the screen fully first and only then suspends
# (see docs/FAQ.md, "The screen hangs after sleep"). hypridle keeps its .conf format; only the
# hyprctl commands changed with Hyprland 0.57 (dispatchers are Lua).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: screens off
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: sleep
listener {
    timeout = 1800
    on-timeout = ~/.local/bin/unia-sleep
}
