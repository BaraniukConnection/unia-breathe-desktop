<style>
/* Layout: a full-window wallpaper; a dock of five round favourites with an arrow button sits at the bottom centre.
   Pressing the arrow raises a frosted-glass panel above the dock: scroll rail on the left, folders of tiles in
   two columns, a tiles / all-programs switch in the bottom-right corner. Top left: two separate bubbles (scenario,
   workspace) that open one window with the open workspaces and the saved scenarios. Mock windows tile the desktop
   between the bubbles and the dock. Top centre: the clock bubble (opens the calendar) and, a little further to its
   right, the media bubble (opens the media centre). Top right: the status bubble (layout, volume, Bluetooth, Wi-Fi),
   the bell and the power button; the first two open the notification and control panel. Settings: a narrow panel of
   buttons in the middle of the desktop and, as a separate window to its right, the program the chosen button opens.
   Desktop only, one dark glass look. */
:root {
  --base: #0b2a26;                         /* behind the wallpaper */
  --ink: #eaf6f0;
  --ink-muted: #bfe3d5;
  --accent: #10b981;
  --on-accent: #04231a;
  --glass: rgba(8, 30, 25, .35);           /* every frosted surface: panel, bubbles, windows */
  --glass-strong: rgba(8, 30, 25, .62);    /* menus, toast */
  --pane: rgba(255, 255, 255, .09);        /* wide, medium and large tiles */
  --pane-hover: rgba(255, 255, 255, .15);
  --pane-line: rgba(255, 255, 255, .14);
  --blur: blur(30px) saturate(160%) brightness(.84);   /* the slight dimming keeps text readable at 35 % */
  --shadow: 0 18px 48px rgba(0, 0, 0, .38);
  --shadow-s: 0 6px 16px rgba(0, 0, 0, .35);
  --mark-mint: #13eca4;
  --mark-blue: #5b9bff;
  --mark-amber: #f59e0b;
  --mark-red: #f26464;
  --mark-purple: #b57bf9;
  --mark-emerald: #10b981;
  --mark-pink: #f06fae;
  --mark-slate: #9aa9bd;
  --font: Manrope, Roboto, system-ui, sans-serif;
  --u: 48px;    /* one small tile */
  --g: 8px;     /* gap between tiles */
  --gc: 8;      /* small-tile columns per folder */
  --gw: calc(var(--gc) * var(--u) + (var(--gc) - 1) * var(--g));
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--base); color: var(--ink);
  font: 400 14px/20px var(--font);
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ms {
  font-family: 'Material Symbols Outlined'; font-weight: 400; font-style: normal;
  font-size: 22px; line-height: 1; width: 1em; height: 1em; flex: none;
  display: inline-block; overflow: hidden; white-space: nowrap; letter-spacing: normal;
  text-transform: none; direction: ltr; font-feature-settings: 'liga';
  font-variation-settings: 'FILL' 1; -webkit-font-smoothing: antialiased;
}

/* ---------- Stage ---------- */
.stage { position: relative; height: 100%; overflow: hidden; }
.wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- Dock: favourites + arrow ---------- */
.dock {
  position: absolute; left: 50%; bottom: 20px; z-index: 12; transform: translateX(-50%);
  width: 376px; height: 106px; transition: height .25s ease;
}
.favs {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  display: flex; gap: 14px; transition: top .25s ease;
}
.fav {
  width: 64px; height: 64px; flex: none; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; background: var(--mark); color: var(--on-accent);
  box-shadow: var(--shadow-s); transition: width .25s ease, height .25s ease, transform .12s ease;
}
.fav .ms { font-size: 30px; transition: font-size .25s ease; }
.fav:hover { transform: translateY(-3px); }
.fav:active { transform: scale(.94); }
.fav.empty {
  background: var(--glass); box-shadow: inset 0 0 0 1px var(--pane-line); cursor: default;
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
}
.fav.empty:hover, .fav.empty:active { transform: none; }
.arrow {
  position: absolute; left: 50%; top: 78px; transform: translateX(-50%);
  width: 88px; height: 28px; padding: 0; border: 0; border-radius: 9999px; cursor: pointer;
  display: grid; place-items: center; background: var(--glass); color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--pane-line), var(--shadow-s);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  transition: top .25s ease, background .16s ease;
}
.arrow:hover { background: rgba(8, 30, 25, .55); }
.arrow svg { width: 22px; height: 22px; transition: transform .25s ease; }
.stage.open .dock { height: 92px; }
.stage.open .arrow { top: 0; }
.stage.open .arrow svg { transform: rotate(180deg); }
.stage.open .favs { top: 40px; }
.stage.open .fav { width: 52px; height: 52px; }
.stage.open .fav .ms { font-size: 26px; }

/* ---------- Panel ---------- */
.panel {
  position: absolute; left: 50%; bottom: 124px; z-index: 10; transform: translateX(-50%);
  height: min(580px, calc(100% - 144px)); width: max-content;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--glass); border-radius: 28px;
  box-shadow: inset 0 0 0 1px var(--pane-line), var(--shadow);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  animation: rise .22s ease;
}
@keyframes rise { from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.98); } }
.panel-main { display: flex; flex: 1; min-height: 0; }

/* Scroll rail: a line with a dot at each end, the thumb rides on it. */
.rail { position: relative; width: 28px; flex: none; margin: 22px 0 6px; cursor: pointer; touch-action: none; }
.rail::before { content: ""; position: absolute; left: 13px; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; background: var(--pane-line); }
.rail-dot { position: absolute; left: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); opacity: .7; }
.rail-dot.top { top: 0; }
.rail-dot.bottom { bottom: 0; }
.rail-thumb { position: absolute; left: 11px; top: 12px; width: 6px; height: 40px; border-radius: 6px; background: var(--accent); cursor: grab; }
.rail-thumb::before { content: ""; position: absolute; inset: 0 -8px; }

.scroller { overflow-x: hidden; overflow-y: auto; scrollbar-width: none; width: calc(var(--cols, 2) * (var(--gw) + 24px) + 12px); }
.scroller::-webkit-scrollbar { display: none; }
.tiles { display: flex; align-items: flex-start; gap: 24px; padding: 12px 24px 24px 12px; }
.panel[data-view="apps"] .tiles, .panel[data-view="tiles"] .allapps { display: none; }
.col { flex: none; width: var(--gw); min-height: 120px; display: flex; flex-direction: column; gap: 24px; }

.panel-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 16px 14px 20px; }
.quiet {
  height: 36px; padding: 0 12px 0 8px; border: 0; border-radius: 9999px; background: none; cursor: pointer;
  display: flex; align-items: center; gap: 8px; color: var(--ink-muted); font: 600 13px/18px var(--font);
}
.quiet:hover { background: var(--pane); color: var(--ink); }
.quiet .ms { font-size: 20px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 9999px; background: var(--pane); box-shadow: inset 0 0 0 1px var(--pane-line); }
.seg-btn {
  height: 32px; padding: 0 16px; border: 0; border-radius: 9999px; background: none; cursor: pointer;
  font: 600 13px/18px var(--font); color: var(--ink);
}
.seg-btn:hover { background: var(--pane); }
.seg-btn[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

/* ---------- Folders and tiles ---------- */
.group-head { display: flex; align-items: center; gap: 4px; height: 40px; margin-bottom: 4px; }
.group-name {
  flex: 1; min-width: 0; height: 32px; margin-left: -8px; padding: 0 8px; border: 0; border-radius: 10px;
  background: transparent; color: var(--ink); font: 700 14px/20px var(--font);
  -webkit-user-select: text; user-select: text; text-overflow: ellipsis;
}
.group-name::placeholder { color: transparent; font-weight: 500; }
.group:hover .group-name::placeholder, .group-name:focus::placeholder { color: var(--ink-muted); }
.group-name:hover, .group-name:focus { background: var(--pane); }
.group-name:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.group-grip {
  width: 32px; height: 32px; flex: none; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--ink-muted);
  display: grid; place-items: center; cursor: grab; touch-action: none; opacity: 0; transition: opacity .16s;
}
.group:hover .group-grip, .group-grip:focus-visible { opacity: 1; }
.group-grip:hover { background: var(--pane); color: var(--ink); }

.grid { position: relative; height: calc(var(--rows) * var(--u) + (var(--rows) - 1) * var(--g)); transition: height .16s ease; }
.tile {
  position: absolute;
  left: calc(var(--x) * (var(--u) + var(--g)));
  top: calc(var(--y) * (var(--u) + var(--g)));
  width: calc(var(--w) * var(--u) + (var(--w) - 1) * var(--g));
  height: calc(var(--h) * var(--u) + (var(--h) - 1) * var(--g));
  overflow: hidden; cursor: default; border-radius: 18px;
  background: var(--pane); box-shadow: inset 0 0 0 1px var(--pane-line);
  transition: left .16s ease, top .16s ease, width .16s ease, height .16s ease, transform .12s ease, background .16s ease;
}
.tile:hover { background: var(--pane-hover); }
.tile:active { transform: scale(.97); }
.tile:focus-visible { z-index: 2; }
.tile-front {
  position: absolute; inset: 0; padding: 10px; display: flex; flex-direction: column;
  justify-content: space-between; align-items: flex-start; transition: transform .4s ease;
}
.chip {
  width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center;
  background: var(--mark); color: var(--on-accent);
}
.chip .ms { font-size: 24px; }
.chip-s { width: 28px; height: 28px; border-radius: 8px; }
.chip-s .ms { font-size: 18px; }
.tile-label { max-width: 100%; font: 600 12px/16px var(--font); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Small tiles are the bare app icon: no glass pane. */
.tile[data-size="small"], .tile[data-size="small"]:hover { background: none; box-shadow: none; border-radius: 14px; }
.tile[data-size="small"] .tile-front { padding: 0; }
.tile[data-size="small"] .chip { width: 100%; height: 100%; border-radius: 14px; }
.tile[data-size="small"] .chip .ms { font-size: 26px; }
.tile[data-size="small"] .tile-label { display: none; }
.tile[data-size="wide"] .chip { width: 48px; height: 48px; border-radius: 14px; }
.tile[data-size="wide"] .chip .ms { font-size: 28px; }
.tile[data-size="large"] { border-radius: 22px; }
.tile[data-size="large"] .tile-front { padding: 16px; }
.tile[data-size="large"] .chip { width: 72px; height: 72px; border-radius: 20px; }
.tile[data-size="large"] .chip .ms { font-size: 40px; }
.tile[data-size="large"] .tile-label { font: 700 16px/22px var(--font); }

/* Live face slides in from below while the icon face leaves upwards. */
.tile-live {
  position: absolute; inset: 0; padding: 10px 12px; display: none; flex-direction: column; justify-content: flex-end; gap: 2px;
  transform: translateY(101%); transition: transform .4s ease;
}
.tile.live .tile-live { display: flex; }
.tile.live-show .tile-live { transform: none; }
.tile.live-show .tile-front { transform: translateY(-101%); }
.tile.live-static .tile-live, .tile.live-static .tile-front { transition: none; }
.lv-app { position: absolute; top: 10px; right: 10px; color: var(--ink-muted); }
.lv-app .ms { font-size: 18px; }
.lv-over { font: 700 11px/14px var(--font); letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-muted); }
.lv-big { font: 800 28px/32px var(--font); letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.lv-cap { font: 500 12px/16px var(--font); color: var(--ink-muted); }
.lv-text { font: 500 12px/16px var(--font); overflow: hidden; }
.tile[data-size="wide"] .lv-big { font-size: 36px; line-height: 40px; }
.tile[data-size="wide"] .lv-text { font-size: 14px; line-height: 20px; }
.tile[data-size="large"] .tile-live { padding: 16px; gap: 6px; }
.tile[data-size="large"] .lv-big { font-size: 64px; line-height: 68px; letter-spacing: -1.5px; }
.tile[data-size="large"] .lv-cap { font-size: 14px; line-height: 20px; }
.tile[data-size="large"] .lv-text { font: 600 18px/26px var(--font); }
.pic { position: absolute; inset: 0; }
.pic-0 { background: radial-gradient(circle at 72% 30%, #f59e0b 0 13%, transparent 14%), linear-gradient(162deg, transparent 63%, #10b981 63.5%), linear-gradient(198deg, transparent 70%, #047857 70.5%), linear-gradient(#3b82f6, #a9ccff); }
.pic-1 { background: radial-gradient(circle at 26% 28%, #e6f2ec 0 9%, transparent 10%), linear-gradient(170deg, transparent 66%, #a855f7 66.5%), linear-gradient(196deg, transparent 74%, #6d28d9 74.5%), linear-gradient(#10221c, #233a6b); }
.pic-2 { background: radial-gradient(circle at 50% 58%, #ef4444 0 16%, transparent 17%), linear-gradient(transparent 58%, #3b82f6 58.5%, #1d4ed8), linear-gradient(#f59e0b, #ec4899); }

/* Drag states */
.tile.is-slot, .tile.is-slot:hover { background: transparent; box-shadow: none; outline: 2px dashed var(--accent); outline-offset: -2px; transition: none; transform: none; }
.tile.is-slot > * { visibility: hidden; }
.tile.ghost {
  position: fixed; z-index: 50; margin: 0; pointer-events: none; transition: none; transform: scale(1.04);
  box-shadow: inset 0 0 0 1px var(--pane-line), var(--shadow-s);
  background: rgba(40, 72, 62, .6); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
}
.tile.ghost[data-size="small"] { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: var(--shadow-s); }
.tile.flash { box-shadow: 0 0 0 2px var(--accent); }
body.dragging, body.dragging * { cursor: grabbing !important; }

.tiles.collapsed .grid { display: none; }
.tiles.collapsed .col { gap: 8px; }
.tiles.collapsed .group-head { margin: 0; padding: 0 4px 0 16px; height: 44px; border-radius: 12px; background: var(--pane); box-shadow: inset 0 0 0 1px var(--pane-line); }
.tiles.collapsed .group-name::placeholder { color: var(--ink-muted); }
.tiles.collapsed .group-grip { opacity: 1; }
.group.is-slot .group-head { background: transparent; box-shadow: none; outline: 2px dashed var(--accent); outline-offset: -2px; }
.group.is-slot .group-head > * { visibility: hidden; }
.group-ghost {
  position: fixed; z-index: 50; pointer-events: none; height: 44px; padding: 0 16px; border-radius: 12px;
  display: flex; align-items: center; font: 700 14px/20px var(--font);
  background: rgba(40, 72, 62, .6); box-shadow: inset 0 0 0 1px var(--pane-line), var(--shadow-s);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
}

/* ---------- All programs ---------- */
.allapps { padding: 12px 24px 24px 12px; }
.allapps-in { columns: 4 190px; column-gap: 16px; }
.letter { padding: 10px 8px 4px; font: 700 13px/18px var(--font); letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-muted); break-after: avoid; }
.app-row {
  width: 100%; height: 48px; padding: 0 8px; border: 0; border-radius: 12px; background: none; cursor: default;
  display: flex; align-items: center; gap: 12px; text-align: left; break-inside: avoid;
}
.app-row:hover { background: var(--pane); }
.app-text { min-width: 0; display: flex; flex-direction: column; }
.app-name { font: 600 14px/18px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-where { font: 500 12px/16px var(--font); color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Workspace and scenario bubbles ---------- */
.wsbar { position: absolute; left: 20px; top: 16px; z-index: 14; display: flex; gap: 10px; }
.bubble {
  height: 44px; padding: 0 6px 0 16px; border: 0; border-radius: 9999px; cursor: pointer;
  display: flex; align-items: center; gap: 10px; background: var(--glass); color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--pane-line), var(--shadow-s);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
}
.bubble-label { font: 600 13px/18px var(--font); color: var(--ink-muted); }
.bubble-val {
  height: 32px; min-width: 32px; padding: 0 14px; border-radius: 9999px; overflow: hidden;
  display: grid; place-items: center; background: var(--pane-hover); box-shadow: inset 0 0 0 1px var(--pane-line);
  font: 700 14px/20px var(--font); font-variant-numeric: tabular-nums; transition: background .16s ease, color .16s ease;
}
.bubble-val.round { padding: 0; width: 32px; }
.bubble-val > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.bubble-val .mod { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.bubble:hover .bubble-val { background: rgba(255, 255, 255, .22); }
.bubble[aria-expanded="true"] .bubble-val { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.bubble[aria-expanded="true"] .bubble-val .mod { background: var(--on-accent); }

.wswin {
  position: absolute; left: 20px; top: 70px; z-index: 14; width: 384px; padding: 12px; border-radius: 26px;
  display: flex; flex-direction: column; gap: 12px; background: var(--glass);
  box-shadow: inset 0 0 0 1px var(--pane-line), var(--shadow);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  animation: drop .2s ease;
}
@keyframes drop { from { opacity: 0; transform: translateY(-10px) scale(.98); } }
.sec { padding: 8px 14px 8px; border-radius: 18px; background: var(--pane); box-shadow: inset 0 0 0 1px var(--pane-line); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 40px; }
.sec-head h2 { margin: 0; font: 700 14px/20px var(--font); }
.sec-head .quiet { margin-right: -8px; }
.hscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 4px 2px 6px; }
.hscroll::-webkit-scrollbar { display: none; }
.ws-row { display: flex; gap: 10px; }
.ws-dot {
  width: 40px; height: 40px; flex: none; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; background: var(--pane-hover); box-shadow: inset 0 0 0 1px var(--pane-line);
  font: 700 14px/20px var(--font); font-variant-numeric: tabular-nums;
}
.ws-dot:hover { background: rgba(255, 255, 255, .22); }
.ws-dot.on { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.ws-dot.add { background: none; box-shadow: none; border: 1px dashed var(--ink-muted); color: var(--ink-muted); }
.ws-dot.add .ms { font-size: 20px; }
.sc-grid { display: grid; grid-template-rows: repeat(2, 96px); grid-auto-flow: column; grid-auto-columns: 96px; gap: 10px; }
.sc-card {
  padding: 10px; border: 0; border-radius: 18px; cursor: pointer; text-align: left; min-width: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  background: var(--pane-hover); box-shadow: inset 0 0 0 1px var(--pane-line);
}
.sc-card:hover { background: rgba(255, 255, 255, .22); }
.sc-card.on { box-shadow: inset 0 0 0 2px var(--accent); }
.sc-prev { position: relative; height: 46px; border-radius: 8px; background: rgba(0, 0, 0, .24); overflow: hidden; }
.sc-prev i { position: absolute; border-radius: 3px; background: var(--mark); }
.sc-name { font: 700 13px/16px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-form { display: flex; gap: 8px; margin: 2px 0 8px; }
.save-form input {
  flex: 1; min-width: 0; height: 36px; padding: 0 14px; border: 0; border-radius: 9999px;
  background: rgba(0, 0, 0, .26); box-shadow: inset 0 0 0 1px var(--pane-line); color: var(--ink);
  font: 600 13px/18px var(--font); -webkit-user-select: text; user-select: text;
}
.save-form input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.solid { height: 36px; padding: 0 16px; border: 0; border-radius: 9999px; cursor: pointer; background: var(--accent); color: var(--on-accent); font: 700 13px/18px var(--font); }
.hrail { position: relative; height: 20px; margin: 2px 2px 0; cursor: pointer; touch-action: none; }
.hrail::before { content: ""; position: absolute; left: 4px; right: 4px; top: 9px; height: 2px; border-radius: 2px; background: var(--pane-line); }
.hrail .rail-dot { left: auto; top: 6px; }
.hrail .rail-dot.a { left: 0; }

const volIcon = () => (sys.muted || sys.vol === 0 ? 'volume_off' : 'volume_up');

let hintFor = null;

  // panel

  $('qWifiSub').textContent = sys.wifi ? sys.net : 'Off';
  $('qBt').setAttribute('aria-pressed', sys.bt); $('qBt').firstElementChild.textContent = sys.bt ? 'bluetooth' : 'bluetooth_disabled';
  $('qBtSub').textContent = sys.bt ? dev.name : 'Off';
  $('volFill').style.width = (sys.muted ? 0 : sys.vol) + '%';
  $('volVal').textContent = sys.muted ? 'off' : sys.vol + '%';
  $('volRange').value = sys.vol;
  $('volMute').firstElementChild.textContent = volIcon();
  $('volMute').setAttribute('aria-label', sys.muted ? 'Unmute' : 'Mute');

  $nList.replaceChildren();
  for (const n of sys.notes) {

    el.innerHTML = `<span class="chip chip-s" style="--mark:var(--mark-${a.mark})">${ms(a.icon)}</span><span class="note-main"><span class="note-title"></span><span class="note-text"></span></span><span class="note-time"></span><button class="icon-btn" type="button" aria-label="Dismiss notification">${ms('close')}</button>`;
    el.querySelector('.note-title').textContent = n.title;

// What a plain hover shows under each part of the status bubble.
function showHint(st) {
  const kind = st.dataset.st, dev = BT_DEVS[sys.btDev];
  const row = (icon, text, sub, cur) => `<span class="hint-row${cur ? ' cur' : ''}">${icon ? ms(icon) : ''}<span>${text}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</span>`;
  let html;
  if (kind === 'kb') html = row('', LAYOUTS[sys.layout].name);
  else if (kind === 'vol') html = sys.bt && dev.audio ? row(dev.icon, dev.name, 'Bluetooth') : row('speaker', 'Speakers');
  else if (kind === 'bt') html = sys.bt ? BT_DEVS.map((d, i) => row(d.icon, d.name, i === sys.btDev ? 'connected' : '', i === sys.btDev)).join('') : row('bluetooth_disabled', 'Bluetooth is off');
  else html = sys.wifi ? row('wifi', sys.net, `signal ${sys.signal}%`) : row('wifi_off', 'Wi-Fi is off');
  $stHint.innerHTML = html;
  hintFor = st;
  const bar = $('sysbar').getBoundingClientRect(), r = st.getBoundingClientRect(), w = $stHint.offsetWidth;
  $stHint.style.left = Math.min(r.left + r.width / 2 - w / 2 - bar.left, bar.width - w) + 'px';
  $stHint.classList.toggle('on', $ncwin.hidden);
}
function hideHint() { hintFor = null; $stHint.classList.remove('on'); }
$statPill.addEventListener('pointerover', e => { const st = e.target.closest('.st'); if (st) showHint(st); else hideHint(); });
$statPill.addEventListener('pointerleave', hideHint);
// The wheel changes the value under the pointer: layout, volume or Bluetooth device.
$statPill.addEventListener('wheel', e => {
  const st = e.target.closest('.st'); if (!st) return;
  const kind = st.dataset.st;
  if (kind === 'vol') {
    e.preventDefault(); if (!e.deltaY) return;
    sys.muted = false; sys.vol = clamp(sys.vol + (e.deltaY < 0 ? 2 : -2), 0, 100); renderSys();
  } else if (kind === 'kb') wheelStep(e, () => { sys.layout = (sys.layout + 1) % LAYOUTS.length; renderSys(); });
  else if (kind === 'bt' && sys.bt) wheelStep(e, d => { sys.btDev = (sys.btDev + d + BT_DEVS.length) % BT_DEVS.length; renderSys(); });
}, { passive: false });
function toggleNc(open) {

for (let i = 0; i < 6; i++) {   // placeholders until the settings window exists

// Drop labels from the top row, step by step, until the media bubble and the status bubble no longer touch.
function fitTop() {

// ---------- Settings: buttons that each open one program ----------
// kind 'app': a ready program opens as its own window beside the panel (names are candidates to confirm).
// kind 'own': no ready GUI exists; the value is set through the command shown.
const SET_TABS = [{ id: 'main', label: 'General' }, { id: 'custom', label: 'Personalize' }, { id: 'devices', label: 'Devices' }];
const SETTINGS = {
  main: [
    { id: 'net', label: 'Network', icon: 'wifi', kind: 'app', tool: 'Network editor', cmd: 'nm-connection-editor' },
    { id: 'bt', label: 'Bluetooth', icon: 'bluetooth', kind: 'app', tool: 'Blueman', cmd: 'blueman-manager' },
    { id: 'time', label: 'Date & Time', icon: 'schedule', kind: 'own', what: 'time zone, sync, clock format', cmd: 'timedatectl' },
    { id: 'sound', label: 'Sound', icon: 'volume_up', kind: 'app', tool: 'pavucontrol', cmd: 'pavucontrol' },
    { id: 'display', label: 'Displays', icon: 'monitor', kind: 'app', tool: 'nwg-displays', cmd: 'nwg-displays' },
    { id: 'layout', label: 'Keyboard Layout', icon: 'keyboard', kind: 'own', what: 'languages and how to switch layouts', cmd: 'hyprctl keyword input:kb_layout' },
  ],
  custom: [
    { id: 'wall', label: 'Wallpaper', icon: 'wallpaper', kind: 'app', tool: 'Waypaper', cmd: 'waypaper' },
    { id: 'colors', label: 'Colours', icon: 'palette', kind: 'app', tool: 'nwg-look', cmd: 'nwg-look', note: 'These are GTK themes; Qt apps have their own qt6ct.' },
    { id: 'opacity', label: 'Transparency', icon: 'opacity', kind: 'own', what: 'window opacity and blur', cmd: 'hyprctl keyword decoration:active_opacity' },
    { id: 'borders', label: 'Windows & Borders', icon: 'border_style', kind: 'own', what: 'gaps between windows, borders, rounding', cmd: 'hyprctl keyword general:border_size' },
  ],
  devices: [
    { id: 'mouse', label: 'Mouse', icon: 'mouse', kids: [
      { id: 'mouse-speed', label: 'Speed & Acceleration', kind: 'own', what: 'sensitivity and the acceleration profile', cmd: 'hyprctl keyword input:sensitivity' },
      { id: 'mouse-buttons', label: 'Buttons & DPI', kind: 'app', tool: 'Piper', cmd: 'piper' },
    ] },
    { id: 'keyboard', label: 'Keyboard', icon: 'keyboard', kids: [
      { id: 'kb-layout', label: 'Language & Layout', kind: 'own', what: 'languages and how to switch layouts', cmd: 'hyprctl keyword input:kb_layout' },
      { id: 'kb-rgb', label: 'Backlight', kind: 'app', tool: 'OpenRGB', cmd: 'openrgb' },
    ] },
    { id: 'printers', label: 'Printers', icon: 'print', kind: 'app', tool: 'system-config-printer', cmd: 'system-config-printer' },
    { id: 'tablet', label: 'Drawing Tablet', icon: 'draw', kind: 'app', tool: 'OpenTabletDriver', cmd: 'otd-gui' },
  ],
};
const $setwrap = $('setwrap'), $setScrim = $('setScrim');
const setState = { tab: 'main', sel: 'net', open: {} };
const leavesOf = tab => SETTINGS[tab].flatMap(it => (it.kids ? it.kids.map(k => ({ ...k, icon: it.icon, parent: it })) : [it]));
function renderSettings() {
  const tabs = $('setTabs'); tabs.replaceChildren();
  for (const t of SET_TABS) {
    const b = h('button', 'seg-btn'); b.type = 'button'; b.setAttribute('role', 'tab'); b.textContent = t.label;
    b.setAttribute('aria-selected', t.id === setState.tab);
    b.addEventListener('click', () => {
      setState.tab = t.id;
      if (!leavesOf(t.id).some(l => l.id === setState.sel)) {   // show this tab's first program
        const first = leavesOf(t.id)[0]; setState.sel = first.id; if (first.parent) setState.open[first.parent.id] = true;
      }
      renderSettings();
    });
    tabs.append(b);
  }
  const list = $('setList'); list.replaceChildren();
  const leafBtn = (it, icon) => {
    const b = h('button', 'set-item' + (it.id === setState.sel ? ' on' : '')); b.type = 'button';
    b.innerHTML = `${icon ? `<span class="set-ico">${ms(icon)}</span>` : ''}<span class="set-text"><span class="set-label"></span><span class="set-sub"></span></span>`;
    b.querySelector('.set-label').textContent = it.label;
    b.querySelector('.set-sub').textContent = it.kind === 'app' ? it.tool : 'no ready app';

    b.addEventListener('click', () => { setState.sel = it.id; renderSettings(); });
    return b;
  };
  for (const it of SETTINGS[setState.tab]) {
    if (!it.kids) { list.append(leafBtn(it, it.icon)); continue; }
    const open = !!setState.open[it.id];
    const b = h('button', 'set-item'); b.type = 'button'; b.setAttribute('aria-expanded', open);
    b.innerHTML = `<span class="set-ico">${ms(it.icon)}</span><span class="set-text"><span class="set-label"></span><span class="set-sub"></span></span>${ms('chevron_right').replace('class="ms"', 'class="ms chev"')}`;
    b.querySelector('.set-label').textContent = it.label;
    b.querySelector('.set-sub').textContent = it.kids.map(k => k.label.toLowerCase()).join(', ');
    b.addEventListener('click', () => { setState.open[it.id] = !open; renderSettings(); });
    list.append(b);

  }

    <div class="tool-body"><div class="tool-ico">${ms(leaf.icon)}</div><h3></h3><p></p><div class="cmd-row"><span class="cmd-cap">${app ? 'Launched with' : 'Controlled through'}</span><span class="cmd"></span></div></div>`;
  tool.querySelector('.win-title').textContent = `${leaf.parent ? leaf.parent.label + ': ' + leaf.label.toLowerCase() : leaf.label}`;
  tool.querySelector('h3').textContent = app ? leaf.tool : 'No ready app';
  tool.querySelector('p').textContent = app
    ? 'This app\'s window opens here. Hyprland keeps it to the right of the panel, so together they look like one window.' + (leaf.note ? ' ' + leaf.note : '')

// ---------- Wallpaper placeholder ----------
function paint() {
  const w = $stage.clientWidth, hh = $stage.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (!w || !hh) return;
  $wall.width = Math.round(w * dpr); $wall.height = Math.round(hh * dpr);
  const x = $wall.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = x.createLinearGradient(0, 0, 0, hh);
  sky.addColorStop(0, '#132c44'); sky.addColorStop(.42, '#2a6a78'); sky.addColorStop(.68, '#e0ad7c'); sky.addColorStop(1, '#f0cf9f');
  x.fillStyle = sky; x.fillRect(0, 0, w, hh);
  const sx = w * .74, sy = hh * .47, r = Math.min(w, hh) * .085;
  const glow = x.createRadialGradient(sx, sy, r * .4, sx, sy, r * 5);
  glow.addColorStop(0, 'rgba(255,236,190,.85)'); glow.addColorStop(1, 'rgba(255,236,190,0)');
  x.fillStyle = glow; x.fillRect(0, 0, w, hh);
  x.fillStyle = '#fff1cf'; x.beginPath(); x.arc(sx, sy, r, 0, Math.PI * 2); x.fill();
  const layers = [['#8fd6bd', .55, 34, .9], ['#4cc39c', .62, 48, 1.7], ['#10b981', .70, 56, 2.6], ['#0b8c63', .78, 50, 3.9], ['#0a5d46', .86, 44, 5.3], ['#083b2f', .94, 32, 7.1]];
  const k = hh / 800;
  for (const [color, base, amp, ph] of layers) {
    x.fillStyle = color; x.beginPath(); x.moveTo(0, hh);
    for (let px = 0; px <= w + 8; px += 8) {
      const t = px / 1400;
      x.lineTo(px, hh * base - amp * k * (Math.sin(t * 5.1 + ph) + .55 * Math.sin(t * 11.3 + ph * 1.7) + .3 * Math.sin(t * 23 + ph * .6)));
    }
    x.lineTo(w, hh); x.closePath(); x.fill();
  }
}

function measure() {
  const gw = GC * U + (GC - 1) * G;

}

$('reset').addEventListener('click', () => {
  const prev = clone(state);

window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (menu) closeMenu();
  else if (drag) cancelDrag();
  else if (!$panel.hidden || !$wswin.hidden || !$calwin.hidden || !$medwin.hidden || !$ncwin.hidden) closeOthers(null);

window.addEventListener('scroll', () => closeMenu(false), true);

// ---------- Boot ----------
buildApps();
measure();
paint();
render();
syncApps();
renderDock();
Object.assign(pops, { panel: togglePanel, ws: toggleWs, cal: toggleCal, media: toggleMedia, nc: toggleNc });
renderDesk();
syncWs();
tick();
renderMedia();
renderSys();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderMedia(); fitTop(); });   // re-measure once the fonts are in

})();
