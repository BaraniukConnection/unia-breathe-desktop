# NVIDIA: на час сну зберігати відеопам'ять у файл на диску, а не в оперативній пам'яті.
# Ставиться в /etc/modprobe.d/nvidia-sleep.conf, після чого — перезібрати initramfs і перезавантажитись.
# Каталог має бути на диску (не tmpfs) і мати вільного місця не менше за обсяг відеопам'яті.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
