# NVIDIA: during sleep, keep video memory in a file on disk instead of in RAM.
# Goes into /etc/modprobe.d/nvidia-sleep.conf; then rebuild the initramfs and reboot.
# The directory must be on disk (not tmpfs) with at least as much free space as the card has video memory.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
